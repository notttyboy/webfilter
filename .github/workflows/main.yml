name: Auto Discover Streaming Domains

on:
  schedule:
    # ทุกวันที่ 1 ของเดือน เวลา 01:00 UTC (08:00 เวลาไทย)
    - cron: "0 1 1 * *"
  workflow_dispatch: # กดรันทดสอบด้วยตนเองได้ในแท็บ Actions

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run domain discovery script
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SEARCH_CX: ${{ secrets.SEARCH_CX }}
        run: python scripts/update_blocklist.py

      - name: Commit and push updated candidates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new candidate domains found."
          else
            git commit -m "chore: update pending streaming domain candidates"
            git push
          fi
